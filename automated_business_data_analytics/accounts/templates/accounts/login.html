{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-dark text-white"><h4>Sign In</h4></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-dark w-100">Login</button>
                </form>
                <p class="mt-3 text-center">New user? <a href="{% url 'register' %}">Create account</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
